//  UTILITIES
// ══════════════════════════════════════════════════════════════════
let toastTimer = null;
function showToast(msg, type = 'info') {
  const toast = document.getElementById('toast');
  const inner = document.getElementById('toast-inner');
  const colors = { info: 'bg-gray-800', success: 'bg-green-600', error: 'bg-red-600', warn: 'bg-amber-500' };
  inner.className = `px-5 py-3 rounded-2xl shadow-lg text-white text-sm font-medium ${colors[type] || colors.info}`;
  inner.textContent = msg;
  toast.classList.remove('hidden');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.add('hidden'), 3500);
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const el = document.getElementById(id);
  if (el) { el.classList.add('active'); window.scrollTo(0, 0); }
}

function saveLocal() {
  localStorage.setItem('maknabis_worker', JSON.stringify({ workerName: state.workerName, apiUrl: state.apiUrl }));
}

function loadLocal() {
  try {
    const raw = localStorage.getItem('maknabis_worker');
    if (raw) {
      const d = JSON.parse(raw);
      if (d.workerName) state.workerName = d.workerName;
      if (d.apiUrl) state.apiUrl = d.apiUrl;
    }
    // Legacy fallback: settings key
    const settings = localStorage.getItem('settings');
    if (settings && !state.apiUrl) {
      const s = JSON.parse(settings);
      if (s.apiUrl) state.apiUrl = s.apiUrl;
    }
  } catch (e) { /* ignore */ }
}

// ══════════════════════════════════════════════════════════════════
//  SETTINGS MODAL
// ══════════════════════════════════════════════════════════════════
function openSettings() {
  document.getElementById('modal-worker-name').value = state.workerName;
  document.getElementById('modal-api-url').value = state.apiUrl;
  document.getElementById('settings-modal').classList.add('open');
}

function closeSettings() {
  document.getElementById('settings-modal').classList.remove('open');
}

function closeSettingsIfOverlay(e) {
  if (e.target === document.getElementById('settings-modal')) closeSettings();
}

function saveSettings() {
  const name = document.getElementById('modal-worker-name').value.trim();
  const url  = document.getElementById('modal-api-url').value.trim();
  if (!name) { showToast('أدخل اسمك أولاً', 'warn'); return; }
  if (!url)  { showToast('أدخل رابط API', 'warn'); return; }
  state.workerName = name;
  state.apiUrl = url;
  saveLocal();
  closeSettings();
  showToast('تم حفظ الإعدادات ✓', 'success');
  document.getElementById('home-worker-tag').textContent = name;
  loadCycles();
}

async function testConnection() {
  const url = document.getElementById('modal-api-url').value.trim();
  if (!url) { showToast('أدخل الرابط أولاً', 'warn'); return; }
  showToast('جاري الاختبار…', 'info');
  try {
    const res = await fetch(`${url}?mode=ping`, { redirect: 'follow' });
    const txt = await res.text();
    showToast('الاتصال ناجح ✓', 'success');
  } catch (e) {
    showToast('فشل الاتصال ✗', 'error');
  }
}

// ══════════════════════════════════════════════════════════════════
//  SETUP SCREEN
// ══════════════════════════════════════════════════════════════════
async function setupAndGo() {
  const name = document.getElementById('setup-worker-name').value.trim();
  const url  = document.getElementById('setup-api-url').value.trim();
  if (!name) { showToast('أدخل اسمك أولاً', 'warn'); return; }
  if (!url)  { showToast('أدخل رابط API', 'warn'); return; }
  state.workerName = name;
  state.apiUrl = url;
  saveLocal();
  await gotoHome();
}

// ══════════════════════════════════════════════════════════════════
//  CYCLES
// ══════════════════════════════════════════════════════════════════
async function loadCycles() {
  const icon = document.getElementById('refresh-icon');
  if (icon) icon.textContent = '⏳';
  try {
    const res = await fetch(`${state.apiUrl}?mode=cycles`, { redirect: 'follow' });
    const data = await res.json();
    // Expected: { active: [...], all: [...] }
    state.availableCycles = data.all || data.cycles || [];
    // active can be single object or array
    const active = data.active;
    if (Array.isArray(active) && active.length > 0) {
      state.activeCycle = active[0];
      state.availableCycles = active; // use active list for picker
    } else if (active && !Array.isArray(active)) {
      state.activeCycle = active;
    } else {
      state.activeCycle = null;
    }
  } catch (e) {
    // Keep whatever we had; don't crash
  }
  renderCycleBanner();
  if (icon) icon.textContent = '🔄';
}

function renderCycleBanner() {
  const el = document.getElementById('cycle-banner');
  if (!el) return;

  if (!state.activeCycle) {
    el.innerHTML = `
      <div class="bg-red-50 border border-red-200 rounded-2xl p-4 flex items-center gap-3">
        <span class="text-2xl">⚠️</span>
        <div>
          <div class="font-bold text-red-700 text-sm">لا توجد دورة نشطة</div>
          <div class="text-xs text-red-500 mt-0.5">اطلب من المالك تفعيل دورة</div>
        </div>
      </div>`;
    return;
  }

  const actives = state.availableCycles.filter(c => c.status === 'active' || state.availableCycles.length <= 1);
  const multiActive = actives.length > 1;

  if (multiActive) {
    const options = actives.map(c =>
      `<option value="${c.id}" ${c.id === state.activeCycle.id ? 'selected' : ''}>${c.id} — ${c.name || ''}</option>`
    ).join('');
    el.innerHTML = `
      <div class="bg-green-50 border border-green-200 rounded-2xl p-4">
        <div class="text-xs font-semibold text-green-600 mb-2">الدورة الحالية</div>
        <select onchange="pickCycle(this.value)" class="w-full border border-green-300 rounded-xl px-3 py-2 text-sm text-green-800 bg-white focus:outline-none focus:ring-2 focus:ring-green-500">
          ${options}
        </select>
      </div>`;
  } else {
    el.innerHTML = `
      <div class="bg-green-50 border border-green-200 rounded-2xl p-4 flex items-center gap-3">
        <span class="text-2xl">🟢</span>
        <div>
          <div class="text-xs text-green-600 font-semibold">الدورة النشطة</div>
          <div class="font-bold text-green-800">${state.activeCycle.name || state.activeCycle.id}</div>
          <div class="text-xs text-green-500">${state.activeCycle.id}</div>
        </div>
      </div>`;
  }
}

function pickCycle(id) {
  const found = state.availableCycles.find(c => c.id === id);
  if (found) { state.activeCycle = found; showToast(`تم اختيار: ${found.name || id}`, 'success'); }
}

// ══════════════════════════════════════════════════════════════════
//  HOME SCREEN
// ══════════════════════════════════════════════════════════════════
async function gotoHome() {
  document.getElementById('home-worker-tag').textContent = state.workerName || 'عامل النمو';
  renderPhaseGrid();
  showScreen('screen-home');
  await loadCycles();
}

function renderPhaseGrid() {
  const grid = document.getElementById('phase-grid');
  grid.innerHTML = '';
  Object.entries(PHASES).forEach(([key, meta]) => {
    const c = COLOR[meta.color] || COLOR.gray;
    const card = document.createElement('button');
    card.className = `card-hover ${c.bg} ${c.border} border rounded-2xl p-4 text-right flex flex-col gap-2 active:scale-95 transition`;
    card.onclick = () => openChecklist(key);
    card.innerHTML = `
      <span class="text-3xl">${meta.icon}</span>
      <div class="font-bold ${c.text} text-sm leading-tight">${meta.label}</div>
      <div class="text-xs ${c.text} opacity-60">${key}</div>
    `;
    grid.appendChild(card);
  });
}

// ══════════════════════════════════════════════════════════════════
//  CHECKLIST
// ══════════════════════════════════════════════════════════════════
function openChecklist(key) {
  if (!state.activeCycle) {
    showToast('اطلب من المالك تفعيل دورة', 'warn');
    return;
  }
  state.activeChecklist = key;
  const meta = PHASES[key];
  document.getElementById('checklist-title').textContent = `${meta.icon} ${meta.label}`;
  document.getElementById('checklist-cycle-tag').textContent = `دورة: ${state.activeCycle.name || state.activeCycle.id}`;
  renderChecklistBody(key);
  showScreen('screen-checklist');
}

function renderChecklistBody(key) {
  const body = document.getElementById('checklist-body');
  body.innerHTML = '';
  const checklist = CHECKLISTS[key];
  if (!checklist) return;

  const meta = PHASES[key];
  const c = COLOR[meta.color] || COLOR.gray;

  checklist.sections.forEach(section => {
    const div = document.createElement('div');
    div.className = 'bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden fade-in';

    let fieldsHtml = '';
    section.fields.forEach(field => {
      fieldsHtml += renderField(field);
    });

    div.innerHTML = `
      <div class="section-header px-4 py-3">
        <h3 class="text-white font-bold text-sm">${section.title}</h3>
      </div>
      <div class="p-4 space-y-4">${fieldsHtml}</div>
    `;
    body.appendChild(div);
  });
}

function renderField(field) {
  const req = field.required ? '<span class="text-red-500">*</span>' : '';
  const label = `<label class="block text-sm font-medium text-gray-700 mb-1.5">${field.label} ${req}</label>`;

  if (field.type === 'textarea') {
    return `<div>${label}<textarea name="${field.key}" rows="3" placeholder="${field.label}" class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-green-500 resize-none"></textarea></div>`;
  }

  if (field.type === 'select') {
    const opts = (field.options || []).map(o => `<option value="${o}">${o}</option>`).join('');
    return `<div>${label}<select name="${field.key}" class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-green-500 bg-white"><option value="">— اختر —</option>${opts}</select></div>`;
  }

  // number / text
  const attrs = [
    field.step ? `step="${field.step}"` : '',
    field.min !== undefined ? `min="${field.min}"` : '',
    field.max !== undefined ? `max="${field.max}"` : ''
  ].filter(Boolean).join(' ');

  return `<div>${label}<input name="${field.key}" type="${field.type}" ${attrs} placeholder="${field.label}" class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-green-500" /></div>`;
}

// ══════════════════════════════════════════════════════════════════
//  SUBMIT
// ══════════════════════════════════════════════════════════════════
async function submitChecklist() {
  if (!state.activeCycle) { showToast('لا توجد دورة نشطة', 'error'); return; }
  const key = state.activeChecklist;
  if (!key) return;

  // Collect fields
  const checklistEl = document.getElementById('checklist-body');
  const inputs = checklistEl.querySelectorAll('input, textarea, select');
  const collectedFields = {};
  let missingRequired = false;

  inputs.forEach(inp => {
    if (!inp.name) return;
    const val = inp.value.trim();
    // Check required
    const isReq = inp.closest('div')?.querySelector('span.text-red-500');
    if (isReq && !val) missingRequired = true;
    if (val !== '') collectedFields[inp.name] = val;
  });

  if (missingRequired) { showToast('يرجى تعبئة الحقول الإلزامية *', 'warn'); return; }

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = '⏳ جاري الإرسال…';

  try {
    const payload = {
      type: key,
      cycle_id: state.activeCycle.id,
      worker: state.workerName,
      schema_version: CHECKLISTS_VERSION,
      timestamp: new Date().toISOString(),
      fields: collectedFields
    };

    const body = new URLSearchParams();
    body.append('payload', JSON.stringify(payload));
    body.append('mode', 'submit');

    const res = await fetch(state.apiUrl, { method: 'POST', body, redirect: 'follow' });
    const txt = await res.text();

    // Try to parse; if it has "error" fail
    let parsed = null;
    try { parsed = JSON.parse(txt); } catch (e) { /* raw text OK */ }
    if (parsed && parsed.error) throw new Error(parsed.error);

    // Success
    const meta = PHASES[key];
    document.getElementById('ok-message').textContent =
      `تم حفظ قراءة "${meta.label}" للدورة ${state.activeCycle.name || state.activeCycle.id} — ${new Date().toLocaleTimeString('ar')}`;
    showScreen('screen-submit-ok');

  } catch (e) {
    showToast(`خطأ في الإرسال: ${e.message}`, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '💾 حفظ القراءة';
  }
}

// ══════════════════════════════════════════════════════════════════
//  NAVIGATION
// ══════════════════════════════════════════════════════════════════
function goHome() {
  showScreen('screen-home');
}

function submitAnother() {
  if (state.activeChecklist) openChecklist(state.activeChecklist);
  else showScreen('screen-home');
}

// ══════════════════════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════════════════════
async function init() {
  // 1. Load from localStorage
  loadLocal();

  // 2. Auto-fill from config.js
  if (window.FARM_CONFIG && window.FARM_CONFIG.GROWING_URL !== 'PASTE_YOUR_GROWING_EXEC_URL_HERE') {
    if (!state.apiUrl) state.apiUrl = window.FARM_CONFIG.GROWING_URL;
  }

  // 3. If we have everything, skip setup screen
  if (state.workerName && state.apiUrl) {
    await gotoHome();
  } else {
    // Pre-fill setup fields if we have partial data
    if (state.apiUrl) document.getElementById('setup-api-url').value = state.apiUrl;
    if (state.workerName) document.getElementById('setup-worker-name').value = state.workerName;
    showScreen('screen-setup');
  }
}

// Boot
document.addEventListener('DOMContentLoaded', init);
</script>
