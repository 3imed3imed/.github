name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,media,dashboard]"
      - name: Lint (ruff)
        run: ruff check app tests dashboard
      - name: Secret scan (no committed key material)
        run: python -m pytest tests/test_providers_failure.py::test_no_hardcoded_secrets_in_source -q
      - name: Unit + integration tests (mocked, offline)
        env:
          ALLOW_PAID_SERVICES: "false"
          UPLOAD_ENABLED: "false"
          PUBLIC_AUTO_PUBLISH: "false"
        run: python -m pytest -q
      - name: Health check
        run: python -m app.health || true
      - name: Cost invariant guard
        run: |
          python - <<'PY'
          from app.config import get_settings
          s = get_settings()
          assert not s.safety.allow_paid_services, "paid services must be off in CI"
          assert not s.safety.public_auto_publish, "auto-publish must be off in CI"
          print("safety invariants OK")
          PY
