name: Manual Production

on:
  workflow_dispatch:
    inputs:
      story:
        description: "Story id (fixture id or discovered candidate id)"
        required: true
        default: "fixture-genealogy-coldcase"

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  produce-one:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Asia/Tokyo
      ALLOW_PAID_SERVICES: "false"
      UPLOAD_ENABLED: ${{ vars.UPLOAD_ENABLED || 'false' }}
      PUBLIC_AUTO_PUBLISH: ${{ vars.PUBLIC_AUTO_PUBLISH || 'false' }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      COURTLISTENER_API_TOKEN: ${{ secrets.COURTLISTENER_API_TOKEN }}
      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -e ".[media,youtube]"
      - name: Produce one episode
        run: python -m app.run --story "${{ inputs.story }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: episode-${{ inputs.story }}
          path: projects/${{ inputs.story }}/
          if-no-files-found: ignore
          retention-days: 7
