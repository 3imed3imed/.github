name: Daily Production

on:
  schedule:
    # 02:00 JST == 17:00 UTC (previous day). Single end-to-end run; the app
    # internally sequences discover -> ... -> upload and holds a run lock.
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      stage_a_only:
        description: "Research/verify/select only (no video)"
        type: boolean
        default: false

# Never run two production jobs at once (spec §28, §40).
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TZ: Asia/Tokyo
      ALLOW_PAID_SERVICES: "false"
      UPLOAD_ENABLED: ${{ vars.UPLOAD_ENABLED || 'false' }}
      PUBLIC_AUTO_PUBLISH: ${{ vars.PUBLIC_AUTO_PUBLISH || 'false' }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      COURTLISTENER_API_TOKEN: ${{ secrets.COURTLISTENER_API_TOKEN }}
      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_PLAYLIST_ID: ${{ secrets.YOUTUBE_PLAYLIST_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[media,youtube]"
      - name: Health check (pre-flight)
        run: python -m app.health
      - name: Run pipeline
        run: |
          if [ "${{ inputs.stage_a_only }}" = "true" ]; then
            python -m app.pipeline --stage-a
          else
            python -m app.pipeline
          fi
      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-artifacts
          path: |
            projects/**/final.mp4
            projects/**/*.json
            projects/**/*.srt
            projects/**/thumbnail.jpg
          if-no-files-found: ignore
          retention-days: 7
